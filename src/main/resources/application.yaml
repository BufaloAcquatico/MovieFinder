spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: JWT-Auth
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration : 900
    refreshTokenExpiration: 604800
  datasource:
    url: jdbc:mysql://localhost:3306/movie_finder?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root_pwd
springdoc:
  override-with-generic-response: false