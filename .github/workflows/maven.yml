name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_pwd
          MYSQL_DATABASE: movie_finder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -P 3306 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Wait for MySQL to be ready
      run: |
        echo "Waiting for MySQL to be ready on localhost:3306..."
        sudo apt-get update
        sudo apt-get install -y default-mysql-client
        for i in $(seq 1 30); do
          if mysqladmin ping -h"127.0.0.1" -P 3306 --silent; then
            echo "MySQL is up!"
            exit 0
          fi
          echo "MySQL not up yet - waiting..."
          sleep 2
        done
        echo "MySQL did not start in time" >&2
        exit 1
    - name: Run tests
      run: ./mvnw test

    - name: Package application
      run: ./mvnw package -DskipTests